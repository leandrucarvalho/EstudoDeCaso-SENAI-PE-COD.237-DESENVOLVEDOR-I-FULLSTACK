services:
  db:
    image: postgres:16-alpine
    container_name: mercado-jogadores-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mercado}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mercado}
      POSTGRES_DB: ${POSTGRES_DB:-mercado}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mercado} -d ${POSTGRES_DB:-mercado}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
